services:
  - type: web
    name: acadiana-bathrooms
    runtime: node
    plan: free
    region: virginia
    branch: app
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: LEAD_NOTIFY_EMAIL
        value: "shaun.brasher@gmail.com,shaun@lagniapperealmlabs.com"
      - key: DATABASE_URL
        fromDatabase:
          name: acadiana-leads
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

databases:
  - name: acadiana-leads
    databaseName: acadiana_leads
    plan: free
    region: virginia
    ipAllowList: []
